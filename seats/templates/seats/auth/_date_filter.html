<form method="get" class="bg-white border border-slate-200 rounded-xl shadow-sm p-3 flex flex-wrap items-end gap-2 text-xs">
  {% for key, value in flt.carried.items %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
  <label class="space-y-0.5"><span class="block text-slate-500 font-semibold">Date / from</span>
    <input type="date" name="start" value="{{ flt.start_value }}" class="border border-slate-300 rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-royal-500"></label>
  <label class="space-y-0.5"><span class="block text-slate-500 font-semibold">To (optional)</span>
    <input type="date" name="end" value="{{ flt.end_value }}" class="border border-slate-300 rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-royal-500"></label>
  <button type="submit" class="px-3 py-1.5 rounded-lg bg-royal-600 hover:bg-royal-700 text-white font-semibold">Apply</button>
  <span class="flex flex-wrap gap-1.5 sm:ml-2">
    <a href="?{{ flt.presets.today }}" class="px-3 py-1.5 rounded-lg font-semibold {% if flt.active_preset == 'today' %}bg-navy-800 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}">Today</a>
    <a href="?{{ flt.presets.week }}" class="px-3 py-1.5 rounded-lg font-semibold {% if flt.active_preset == 'week' %}bg-navy-800 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}">Last 7 days</a>
    <a href="?{{ flt.presets.month }}" class="px-3 py-1.5 rounded-lg font-semibold {% if flt.active_preset == 'month' %}bg-navy-800 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}">This month</a>
    {% if flt.is_filtered %}<a href="?{{ flt.clear_query }}" class="px-3 py-1.5 rounded-lg font-semibold text-rose-600 hover:bg-rose-50">Clear</a>{% endif %}
  </span>
  {% if flt.is_filtered %}
    <span class="text-slate-500 sm:ml-auto">Showing {% if flt.start_value == flt.end_value %}{{ flt.start_value }}{% else %}{{ flt.start_value }} to {{ flt.end_value }}{% endif %}</span>
  {% endif %}
</form>
